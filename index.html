<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clock in">
<title>Clock in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<style>
  :root{
    --paper:#E8EEE9; --ink:#14302A; --muted:#5D7068;
    --in:#1E7A55; --out:#2E3D7C; --err:#B3261E; --key:#FFFFFF; --ok:#2FBF71;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans Lao Looped","Phetsarath OT","Saysettha OT",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;overflow:hidden}
  .screen{display:none;height:100%;padding:24px 28px;flex-direction:column}
  .screen.on{display:flex}
  button{font-family:inherit;color:inherit;border:0;cursor:pointer}
  button:focus-visible{outline:4px solid #F2B705;outline-offset:3px}
  button:disabled{opacity:.45;cursor:default}

  /* home */
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:clamp(18px,2.6vw,26px)}
  .branch{font-weight:700}
  .date{color:var(--muted)}
  .clock{flex:1;display:flex;align-items:center;justify-content:center;
    font-size:clamp(96px,22vw,260px);font-weight:700;letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;line-height:1}
  .clock .t{display:flex;align-items:baseline}
  .clock .sec{font-size:.28em;color:var(--muted);margin-left:.15em}
  .status{text-align:center;color:var(--muted);font-size:18px;min-height:26px;margin-bottom:10px}
  .clock.small{font-size:clamp(64px,13vw,170px);flex:0 0 auto;margin:6px 0 14px}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;flex:1;min-height:0}
  .tile{background:#fff;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden;box-shadow:0 2px 0 rgba(20,48,42,.08)}
  .tile .lbl{font-size:clamp(15px,1.9vw,19px);color:var(--muted);font-weight:600}
  .tile .num{font-size:clamp(36px,5.5vw,60px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
  .tile .num small{font-size:.45em;color:var(--muted);font-weight:600}
  .tile .names{font-size:clamp(14px,1.7vw,17px);line-height:1.45;overflow:auto;min-height:0}
  .tile .names .late{color:var(--err);font-weight:600}
  .tile.work .num{color:var(--in)}
  .tile.exp{border-top:6px solid var(--ink)} .tile.work{border-top:6px solid var(--in)}
  .tile.off{border-top:6px solid #8C7AB8} .tile.leave{border-top:6px solid #4F86C6}
  .updated{font-size:13px;color:var(--muted);text-align:right;margin:-8px 2px 8px;display:flex;justify-content:space-between;gap:12px}
  .updated b{color:var(--ink);font-weight:600}
  .summary{cursor:pointer}

  /* teams page */
  #teams{gap:14px}
  .teamGrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-content:start;padding-bottom:10px}
  .team{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 2px 0 rgba(20,48,42,.08)}
  .team h2{margin:0;font-size:clamp(20px,2.6vw,26px);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .team h2 span{font-size:.8em;color:var(--in);font-variant-numeric:tabular-nums;white-space:nowrap}
  .team h2 span small{color:var(--muted);font-weight:600}
  .person{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #E3E9E5;font-size:clamp(16px,2vw,19px)}
  .person:first-of-type{margin-top:8px}
  .chip{border-radius:999px;padding:3px 12px;font-size:.85em;font-weight:600;white-space:nowrap}
  .chip.in{background:#DDF3E7;color:#1E7A55} .chip.inLate{background:#FBE3E1;color:#B3261E}
  .chip.notyet{background:#EEF1EF;color:#5D7068} .chip.absent{background:#FBE3E1;color:#B3261E}
  .chip.out{background:#E4E7EE;color:#2E3D7C} .chip.off{background:#ECE7F6;color:#5E4B8B} .chip.leave{background:#E1ECF8;color:#2F5F96}
  .emptyTeam{color:var(--muted);font-size:16px;margin-top:8px}
  .tile{cursor:pointer} .tile:active{transform:scale(.98)}
  .tile .more{margin-top:auto;font-size:13px;color:var(--muted);font-weight:600}
  .emptyAll{grid-column:1/-1;text-align:center;color:var(--muted);font-size:22px;padding:40px 0}

  /* expanded box on the home screen */
  #home.expanded .clock{display:none}
  .summary.compact{flex:0 0 auto;margin-bottom:10px}
  .summary.compact .names, .summary.compact .more{display:none}
  .summary.compact .tile{padding:10px 14px;opacity:.6}
  .summary.compact .tile.sel{opacity:1;box-shadow:0 0 0 3px var(--ink)}
  .summary.compact .num{font-size:clamp(28px,4vw,42px)}
  .detail{flex:1;min-height:0;background:#fff;border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;margin-bottom:14px;box-shadow:0 2px 0 rgba(20,48,42,.08)}
  .detailHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
  .detailHead span{font-size:clamp(20px,2.6vw,26px);font-weight:700}
  .detailBody{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 26px;align-content:start}
  .grp{margin-bottom:12px}
  .grp h3{margin:0;font-size:clamp(17px,2vw,20px);display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
  .grp h3 small{color:var(--muted);font-weight:600}
  .grp .person:first-of-type{margin-top:0}
  .grp .person{border-top:none;border-bottom:1px solid #E3E9E5;padding:7px 0}
  .extra{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#FFF1D6;color:#8A5A00;font-size:.8em;font-weight:700}
  .topRight{display:flex;align-items:baseline;gap:16px}
  .leaveBtn{background:#fff;border-radius:999px;padding:8px 16px;font-size:clamp(15px,1.8vw,18px);font-weight:600;box-shadow:0 2px 0 rgba(20,48,42,.12)}

  /* leave request form */
  #leaveForm{gap:14px}
  .formBox{width:min(640px,100%);margin:0 auto;display:flex;flex-direction:column;gap:16px;overflow:auto;flex:1;min-height:0}
  .fLabel{font-size:18px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .types{display:flex;flex-wrap:wrap;gap:10px}
  .types button{border-radius:999px;padding:12px 18px;font-size:18px;background:#fff;box-shadow:0 2px 0 rgba(20,48,42,.12)}
  .types button.sel{background:var(--ink);color:#fff}
  .dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dates input,.formBox textarea{width:100%;font-family:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #C9D4CE;background:#fff;color:var(--ink)}
  .formBox textarea{min-height:80px;resize:none}
  .daysInfo{font-size:20px;font-weight:600}
  .sendBtn{border-radius:18px;padding:18px;font-size:26px;font-weight:700;background:var(--in);color:#fff}
  .sendBtn:disabled{opacity:.4}
  .menuBox{width:min(560px,100%);margin:auto;display:flex;flex-direction:column;gap:18px}
  .menuBtn{border-radius:20px;padding:26px 22px;font-size:clamp(22px,3vw,28px);font-weight:700;background:#fff;box-shadow:0 2px 0 rgba(20,48,42,.12);text-align:left}
  .menuBtn small{display:block;font-size:.6em;font-weight:500;color:var(--muted);margin-top:4px}
  .menuInfo{text-align:center;color:var(--muted);font-size:18px}
  #choice{align-items:center;justify-content:center;text-align:center;gap:18px;background:#FFF6E0}
  #choiceTitle{font-size:clamp(28px,4.5vw,44px);font-weight:700;margin:0}
  #choiceSub{font-size:clamp(18px,2.6vw,24px);max-width:34ch;color:var(--muted)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:min(30vh,240px)}
  .act{border-radius:22px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .act b{font-size:clamp(34px,5.5vw,60px);font-weight:700}
  .act span{font-size:clamp(15px,2vw,20px);opacity:.85}
  .act.in{background:var(--in)} .act.out{background:var(--out)}
  .act:active{transform:scale(.98)}
  .banner{background:var(--err);color:#fff;border-radius:12px;padding:12px 16px;margin-top:12px;font-size:18px;display:none}

  /* camera */
  #cam{align-items:center;gap:14px}
  .bar{align-self:stretch;display:flex;justify-content:space-between;align-items:center}
  .bar h1{margin:0;font-size:clamp(26px,4vw,40px)}
  .bar h1.in{color:var(--in)} .bar h1.out{color:var(--out)} .bar h1.mgr{color:var(--ink)}
  .ghost{background:transparent;font-size:20px;padding:10px 14px;color:var(--muted)}
  .stage{position:relative;width:min(70vh,92vw,560px);aspect-ratio:3/4;border-radius:28px;overflow:hidden;background:#0d1f1b;flex:0 1 auto;max-height:62vh}
  .stage video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .oval{position:absolute;left:50%;top:46%;width:62%;height:66%;transform:translate(-50%,-50%);
    border-radius:50%;border:5px solid rgba(255,255,255,.75);box-shadow:0 0 0 9999px rgba(13,31,27,.35);transition:border-color .2s}
  .oval.good{border-color:var(--ok)}
  .camMsg{font-size:clamp(22px,3.4vw,32px);font-weight:600;text-align:center;min-height:1.5em}
  .camSub{font-size:clamp(16px,2.2vw,20px);color:var(--muted);text-align:center;min-height:1.4em}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .pill{border-radius:999px;padding:14px 26px;font-size:20px;font-weight:600;background:#fff;box-shadow:0 2px 0 rgba(20,48,42,.18)}
  .pill.dark{background:var(--ink);color:#fff}
  .hidden{display:none !important}

  /* keypad */
  #pad{align-items:center}
  .padBox{width:min(440px,100%);margin:auto 0;display:flex;flex-direction:column;gap:14px}
  .prompt{font-size:clamp(20px,3vw,26px);text-align:center}
  .display{height:76px;border-radius:14px;background:#fff;border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;
    letter-spacing:.18em;font-variant-numeric:tabular-nums}
  .hint{min-height:28px;text-align:center;color:var(--muted);font-size:18px}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .k{height:clamp(60px,9vh,80px);border-radius:14px;background:var(--key);font-size:34px;font-weight:600;box-shadow:0 2px 0 rgba(20,48,42,.18)}
  .k:active{background:#D5DED8}
  .k.small{font-size:20px}
  .k.go{background:var(--ink);color:#fff;font-size:22px}
  .padVideo{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}

  /* result */
  #result{align-items:center;justify-content:center;text-align:center;gap:10px;color:#fff}
  #result.good-in{background:var(--in)} #result.good-out{background:var(--out)}
  #result.bad{background:var(--err)} #result.busy{background:var(--ink)} #result.good-mgr{background:var(--in)}
  #rBig{font-size:clamp(36px,6vw,64px);font-weight:700;margin:0}
  #rTime{font-size:clamp(70px,14vw,160px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
  #rNote{font-size:clamp(22px,3.4vw,34px);max-width:30ch}
  .tag{display:inline-block;margin-top:6px;padding:6px 18px;border-radius:999px;background:rgba(255,255,255,.2);font-size:clamp(20px,3vw,30px);font-weight:600}
  @media (max-width:600px){ .actions{grid-template-columns:1fr;height:auto} .act{height:120px} }
  @media (max-width:820px){ .summary{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="top"><div class="branch" id="branchName"></div><div class="topRight"><button class="leaveBtn" id="leaveBtn" onclick="startLeave()">📝 ຂໍລາພັກ</button><div class="date" id="today"></div></div></div>
  <div class="banner" id="banner"></div>
  <div class="clock" id="clock"></div>
  <div class="summary hidden" id="summary">
    <div class="tile exp" data-filter="notin"><div class="lbl">ຕ້ອງມາວຽກມື້ນີ້</div><div class="num" id="sExp">–</div><div class="names" id="nExp"></div><div class="more">ເບິ່ງ ›</div></div>
    <div class="tile work" data-filter="work"><div class="lbl">ຢູ່ວຽກແລ້ວ</div><div class="num" id="sWork">–</div><div class="names" id="nWork"></div><div class="more">ເບິ່ງ ›</div></div>
    <div class="tile off" data-filter="off"><div class="lbl">ພັກປະຈຳອາທິດ</div><div class="num" id="sOff">–</div><div class="names" id="nOff"></div><div class="more">ເບິ່ງ ›</div></div>
    <div class="tile leave" data-filter="leave"><div class="lbl">ລາພັກ</div><div class="num" id="sLeave">–</div><div class="names" id="nLeave"></div><div class="more">ເບິ່ງ ›</div></div>
  </div>
  <div class="detail hidden" id="detail">
    <div class="detailHead"><span id="detailTitle"></span><button class="ghost" id="detailClose">✕ ປິດ</button></div>
    <div class="detailBody" id="detailBody"></div>
  </div>
  <div class="updated hidden" id="updated"><b>ແຕະເພື່ອເບິ່ງຕາມທີມ ›</b><span id="updTime"></span></div>
  <div class="status" id="loadStatus">ກຳລັງໂຫຼດລະບົບສະແກນໜ້າ…</div>
  <div class="actions">
    <button class="act in" id="btnIn" onclick="startFace('In')" disabled><b>ເຂົ້າວຽກ</b><span>Clock in</span></button>
    <button class="act out" id="btnOut" onclick="startFace('Out')" disabled><b>ອອກວຽກ</b><span>Clock out</span></button>
  </div>
</section>

<section id="teams" class="screen">
  <div class="bar"><h1 id="teamsTitle" class="mgr">ທີມມື້ນີ້</h1><button class="ghost" onclick="goHome()">‹ ກັບຄືນ</button></div>
  <div class="teamGrid" id="teamGrid"></div>
</section>

<section id="leaveForm" class="screen">
  <div class="bar"><h1 class="mgr" id="leaveTitle">ຂໍລາພັກ</h1><button class="ghost" onclick="goHome()">ຍົກເລີກ</button></div>
  <div class="formBox">
    <div><div class="fLabel">ປະເພດການລາ</div><div class="types" id="leaveTypes"></div></div>
    <div class="dates">
      <div><div class="fLabel">ຈາກວັນທີ</div><input type="date" id="lvFrom"></div>
      <div><div class="fLabel">ຫາວັນທີ</div><input type="date" id="lvTo"></div>
    </div>
    <div class="daysInfo" id="lvDays"></div>
    <div><div class="fLabel">ເຫດຜົນ (ບໍ່ບັງຄັບ)</div><textarea id="lvReason" maxlength="200"></textarea></div>
    <button class="sendBtn" id="lvSend" onclick="sendLeave()">ສົ່ງຄຳຂໍ</button>
  </div>
</section>

<section id="mgrMenu" class="screen">
  <div class="bar"><h1 class="mgr">ຜູ້ຈັດການ</h1><button class="ghost" onclick="goHome()">ອອກ</button></div>
  <div class="menuBox">
    <button class="menuBtn" onclick="mgrPick('enrollId')">📷 ລົງທະບຽນໃບໜ້າ<small>Register a face</small></button>
    <button class="menuBtn" onclick="mgrPick('manualId')">✍️ ບັນທຶກເຂົ້າ/ອອກວຽກແທນ<small>Clock in or out for a staff member</small></button>
    <div class="menuInfo" id="mgrInfo"></div>
  </div>
</section>

<section id="manualForm" class="screen">
  <div class="bar"><h1 class="mgr" id="manTitle">ບັນທຶກແທນ</h1><button class="ghost" onclick="showMgrMenu()">ກັບຄືນ</button></div>
  <div class="formBox">
    <div><div class="fLabel">ບັນທຶກ</div><div class="types" id="manAction"></div></div>
    <div class="dates"><div><div class="fLabel">ເວລາ (ມື້ນີ້)</div><input type="time" id="manTime"></div><div></div></div>
    <div><div class="fLabel">ເຫດຜົນ</div><div class="types" id="manReason"></div></div>
    <button class="sendBtn" id="manSend" onclick="sendManual()">ບັນທຶກ</button>
  </div>
</section>

<section id="choice" class="screen">
  <p id="choiceTitle"></p>
  <div id="choiceSub"></div>
  <div class="row" id="choiceBtns"></div>
</section>

<section id="cam" class="screen">
  <div class="bar"><h1 id="camTitle"></h1><button class="ghost" onclick="goHome()">ຍົກເລີກ</button></div>
  <div class="stage"><video id="video" autoplay muted playsinline></video><div class="oval" id="oval"></div></div>
  <div class="camMsg" id="camMsg"></div>
  <div class="camSub" id="camSub"></div>
  <div class="row hidden" id="camButtons">
    <button class="pill dark" onclick="retryFace()">ລອງໃໝ່</button>
    <button class="pill" id="usePinBtn" onclick="startPin()">ໃຊ້ລະຫັດ PIN</button>
  </div>
</section>

<section id="pad" class="screen">
  <div class="bar"><h1 id="padTitle"></h1><button class="ghost" onclick="goHome()">ຍົກເລີກ</button></div>
  <div class="padBox">
    <div class="prompt" id="prompt"></div>
    <div class="display" id="display"></div>
    <div class="hint" id="hint"></div>
    <div class="keys" id="keys"></div>
  </div>
</section>

<section id="result" class="screen">
  <p id="rBig"></p>
  <div id="rTime"></div>
  <div id="rNote"></div>
</section>

<script>
// ---------------- settings ----------------
const API = 'https://script.google.com/macros/s/AKfycbyuBVRj_ENhG2c2FzBsVXIA-5mXvaPC0YUGOLjjmuhf1mp3R7XsX7rIrF5xCt4fMi2G/exec';
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/';
const FACE_TIMEOUT_MS = 20000;   // give up on face scan after this long
const TURN_NEEDED = 0.12;        // how far the head must turn for the liveness check
const FRONT_MAX = 0.09;          // how straight the face must be when the face code is taken

// tablet settings come from the link once (?branch=...&key=...) and are remembered on the device
(function readSettings(){
  const q = new URLSearchParams(location.search);
  try {
    if (q.get('branch')) localStorage.setItem('kiosk_branch', q.get('branch'));
    if (q.get('key')) localStorage.setItem('kiosk_key', q.get('key'));
  } catch (e) {}
})();
function setting(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
const BRANCH = (new URLSearchParams(location.search).get('branch')) || setting('kiosk_branch');
const KEY = setting('kiosk_key');

const DAYS = ['ວັນອາທິດ','ວັນຈັນ','ວັນອັງຄານ','ວັນພຸດ','ວັນພະຫັດ','ວັນສຸກ','ວັນເສົາ'];
const MONTHS = ['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ'];
const $ = id => document.getElementById(id);

let action = null, mode = 'idle', idleTimer = null, busy = false, stream = null, runToken = 0;
let modelsReady = false, lastPhoto = '';
let padState = null;   // {kind:'pin'|'mgr'|'enrollId', step, id, pin, value}
let managerCode = '';

$('branchName').textContent = BRANCH || 'Clock in';
function showBanner(t){ $('banner').textContent = t; $('banner').style.display = 'block'; }

// ---------------- today's summary on the home screen ----------------
function namesHtml(list){
  return list.map(x => typeof x === 'string' ? esc(x) : (x.late ? '<span class="late">' + esc(x.name) + '</span>' : esc(x.name))).join(', ');
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function loadSummary(){
  if (!KEY || !BRANCH) return;

  if (!r || !r.ok) return;
  $('summary').classList.remove('hidden'); $('updated').classList.remove('hidden');

  $('sWork').innerHTML = r.atWork.length + ' <small>/ ' + r.expected + '</small>';
  $('nWork').innerHTML = r.atWork.map(a => (a.late ? '<span class="late">' : '<span>') + esc(a.name) + ' ' + esc(a.time) + '</span>' + (a.extra ? '<span class="extra">' + (a.extra === 'dayoff' ? 'ວັນພັກ' : 'ລາພັກ') + '</span>' : '')).join(', ')
    + (r.clockedOut.length ? '<br>ອອກແລ້ວ: ' + namesHtml(r.clockedOut) : '');
  $('sOff').textContent = r.dayOff.length;  $('nOff').innerHTML = namesHtml(r.dayOff);
  $('sLeave').textContent = r.leave.length; $('nLeave').innerHTML = namesHtml(r.leave);

function extraText(p){ return p.extra === 'dayoff' ? ' · ວັນພັກ' : p.extra === 'leave' ? ' · ຊ່ວງລາພັກ' : ''; }
// ---------------- teams page ----------------
let lastSummary = null;
const ST_ORDER = { in: 0, inLate: 1, absent: 2, notyet: 3, out: 4, off: 5, leave: 6 };
function chipText(p){
  switch (p.st) {
    case 'in': return '✓ ' + p.time + extraText(p);
    case 'inLate': return 'ຊ້າ · ' + p.time + extraText(p);
    case 'absent': return 'ຍັງບໍ່ມາ (ຊ້າ)';
    case 'notyet': return 'ຍັງບໍ່ມາ · ' + p.shift;
    case 'out': return 'ອອກແລ້ວ ' + (p.out || '');
    case 'off': return 'ພັກປະຈຳ';
    case 'leave': return 'ລາພັກ';
  }
  return '';
}
const FILTERS = {
  all:   { title: 'ທີມມື້ນີ້',        sts: null },
  work:  { title: 'ຢູ່ວຽກແລ້ວ',      sts: ['in', 'inLate'] },
  notin: { title: 'ຍັງບໍ່ມາວຽກ',      sts: ['absent', 'notyet'] },
  off:   { title: 'ພັກປະຈຳອາທິດ',    sts: ['off'] },
  leave: { title: 'ລາພັກ',          sts: ['leave'] }
};
let teamFilter = 'all';
function renderTeams(){
  const r = lastSummary; if (!r) return;
  const f = FILTERS[teamFilter] || FILTERS.all;
  const match = p => !f.sts || f.sts.indexOf(p.st) >= 0;
  const total = r.people.filter(match).length;
  $('teamsTitle').textContent = f.title + (f.sts ? ' · ' + total + ' ຄົນ' : '') + ' · ' + BRANCH;
  const order = (r.teams || []).slice();
  r.people.forEach(p => { if (p.team && order.indexOf(p.team) < 0) order.push(p.team); });
  if (r.people.some(p => !p.team)) order.push('');
  const grid = $('teamGrid'); grid.innerHTML = '';
  order.forEach(team => {
    const members = r.people.filter(p => (p.team || '') === team && match(p))
      .sort((a, b) => (ST_ORDER[a.st] - ST_ORDER[b.st]) || a.name.localeCompare(b.name));
    if (!members.length && (!team || f.sts)) return;
    const working = members.filter(p => p.st === 'in' || p.st === 'inLate').length;
    const expected = members.filter(p => p.st !== 'off' && p.st !== 'leave').length;
    const card = document.createElement('div'); card.className = 'team';
    const count = f.sts ? members.length + ' <small>ຄົນ</small>' : working + ' <small>/ ' + expected + '</small>';
    card.innerHTML = '<h2>' + esc(team || 'ບໍ່ມີທີມ') + '<span>' + count + '</span></h2>' +
      (members.length ? members.map(p => '<div class="person"><span>' + esc(p.name) + '</span><span class="chip ' + p.st + '">' + esc(chipText(p)) + '</span></div>').join('')
                      : '<div class="emptyTeam">ບໍ່ມີພະນັກງານໃນສາຂານີ້</div>');
    grid.appendChild(card);
  });
  if (!grid.children.length) grid.innerHTML = '<div class="emptyAll">ບໍ່ມີໃຜ</div>';
}

let expanded = null, expandTimer = null;
function toggleDetail(filter){
  if (mode !== 'idle' || !lastSummary) return;
  expanded = expanded === filter ? null : filter;
  clearTimeout(expandTimer);
  const on = !!expanded;
  $('home').classList.toggle('expanded', on);
  $('summary').classList.toggle('compact', on);
  $('detail').classList.toggle('hidden', !on);
  document.querySelectorAll('.tile[data-filter]').forEach(t => t.classList.toggle('sel', t.dataset.filter === expanded));
  if (on) { renderDetail(); expandTimer = setTimeout(() => { if (expanded) toggleDetail(expanded); }, 60000); }
}
function collapseDetail(){ if (expanded) { const f = expanded; expanded = f; toggleDetail(f); } }
function renderDetail(){
  const r = lastSummary, f = FILTERS[expanded]; if (!r || !f) return;
  const match = p => f.sts.indexOf(p.st) >= 0;
  const list = r.people.filter(match);
  $('detailTitle').textContent = f.title + ' · ' + list.length + ' ຄົນ';
  const order = (r.teams || []).slice();
  list.forEach(p => { if (p.team && order.indexOf(p.team) < 0) order.push(p.team); });
  if (list.some(p => !p.team)) order.push('');
  let html = '';
  order.forEach(team => {
    const members = list.filter(p => (p.team || '') === team)
      .sort((a, b) => (ST_ORDER[a.st] - ST_ORDER[b.st]) || a.name.localeCompare(b.name));
    if (!members.length) return;
    html += '<div class="grp"><h3>' + esc(team || 'ບໍ່ມີທີມ') + '<small>' + members.length + ' ຄົນ</small></h3>' +
      members.map(p => '<div class="person"><span>' + esc(p.name) + '</span><span class="chip ' + p.st + '">' + esc(chipText(p)) + '</span></div>').join('') + '</div>';
  });
  $('detailBody').innerHTML = html || '<div class="emptyAll">ບໍ່ມີໃຜ</div>';
}

function openTeams(filter){

  mode = 'teams';

function resetIdle(ms){ clearTimeout(idleTimer); idleTimer = setTimeout(goHome, ms || 30000); }

// ---------------- camera ----------------
async function startCamera(){
  if (stream) return true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $('video'); v.srcObject = stream;
    await v.play().catch(() => {});
    await new Promise(r => { if (v.readyState >= 2) r(); else v.onloadeddata = () => r(); });
    return true;
  } catch (e) {
    console.error(e); stream = null; return false;
  }
}
function stopCamera(){
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('video').srcObject = null;
}
function grabPhoto(){
  const v = $('video');
  if (!stream || !v.videoWidth) return '';
  const w = 320, h = Math.round(320 * v.videoHeight / v.videoWidth);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(v, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.7);
}

// how far the head is turned: about 0 when facing the camera, + or - when turned
function yawOf(landmarks){
  const p = landmarks.positions;
  const left = p[0].x, right = p[16].x, nose = p[30].x;
  return (nose - left) / (right - left) - 0.5;
}
function faceBigEnough(det, v){ return det.detection.box.width > v.videoWidth * 0.22; }
const detOpts = () => new faceapi.SsdMobilenetv1Options({ minConfidence: 0.6 });
const sleep = ms => new Promise(r => setTimeout(r, ms));

function camText(msg, sub){ $('camMsg').textContent = msg || ''; $('camSub').textContent = sub || ''; }

// ---------------- clock in / out by face ----------------
async function startFace(a){
  collapseDetail();
  action = a; mode = 'face';
  $('camTitle').textContent = (action === 'In' ? 'ເຂົ້າວຽກ' : action === 'Out' ? 'ອອກວຽກ' : 'ຂໍລາພັກ');
  $('camTitle').className = (action === 'In' ? 'in' : action === 'Out' ? 'out' : 'mgr');
  faceId = '';
  if (!modelsReady) { startPin(); return; }
  mode = 'faceId';
  padState = { kind: 'faceId', value: '' };
  $('padTitle').textContent = $('camTitle').textContent;
  $('padTitle').className = $('camTitle').className;
  $('hint').textContent = 'ແລ້ວສະແກນໃບໜ້າ';
  show('pad'); renderPad(); resetIdle();
  startCamera();   // warm up the camera while the ID is typed
}
let faceId = '';
function retryFace(){ if (action) { resetIdle(45000); runFace(); } }

async function runFace(){
  const token = ++runToken;
  $('camButtons').classList.add('hidden');
  $('oval').classList.remove('good');
  camText('ກຳລັງເປີດກ້ອງ…');
  if (!(await startCamera())) {
    if (token !== runToken) return;
    camText('ເປີດກ້ອງບໍ່ໄດ້', 'ອະນຸຍາດໃຫ້ໃຊ້ກ້ອງ ຫຼື ໃຊ້ລະຫັດ PIN');
    $('camButtons').classList.remove('hidden'); return;
  }
  const v = $('video');
  const deadline = Date.now() + FACE_TIMEOUT_MS;
  const samples = []; let base = null, photo = '', baseMouth = 0;

  // step 1: straight face, take the face code
  camText('ຫັນໜ້າເຂົ້າກ້ອງ ໃຫ້ໜ້າຢູ່ໃນວົງ', 'Look at the camera');
  while (Date.now() < deadline && samples.length < 3) {
    if (token !== runToken) return;
    const det = await faceapi.detectSingleFace(v, detOpts()).withFaceLandmarks().withFaceDescriptor();
    if (token !== runToken) return;
    if (det && faceBigEnough(det, v)) {
      const yaw = yawOf(det.landmarks);
      if (Math.abs(yaw) < FRONT_MAX) {
        samples.push(Array.from(det.descriptor));
        baseMouth += mouthOpen(det.landmarks);
        if (!photo) photo = grabPhoto();
        base = base === null ? yaw : base;
        $('oval').classList.add('good');
        camText('ຢູ່ນິ່ງໆ…', 'Hold still');
      } else camText('ຫັນໜ້າຊື່ໆເຂົ້າກ້ອງ', 'Face the camera straight');
    } else {
      $('oval').classList.remove('good');
      camText(det ? 'ເຂົ້າມາໃກ້ກ້ອງອີກໜ້ອຍ' : 'ຫັນໜ້າເຂົ້າກ້ອງ ໃຫ້ໜ້າຢູ່ໃນວົງ', det ? 'Come a little closer' : 'Look at the camera');
    }
    await sleep(60);
  }
  if (samples.length < 3) return faceFail(token, 'ບໍ່ເຫັນໃບໜ້າ', 'ລອງໃໝ່ ຫຼື ໃຊ້ລະຫັດ PIN');

  // step 2: liveness — a random challenge, so a photo or a recorded video cannot pass
  const ch = CHALLENGES[Math.floor(Math.random() * CHALLENGES.length)];
  camText(ch.msg, ch.sub);
  let passed = false;
  const chDeadline = Math.max(deadline, Date.now() + 8000);
  while (Date.now() < chDeadline) {
    if (token !== runToken) return;
    const det = await faceapi.detectSingleFace(v, detOpts()).withFaceLandmarks();
    if (token !== runToken) return;
    if (det && faceBigEnough(det, v) && ch.test(det.landmarks, { yaw: base, mouth: baseMouth / samples.length })) { passed = true; break; }
    await sleep(50);
  }
  if (!passed) return faceFail(token, 'ກວດບໍ່ຜ່ານ', ch.fail + ' ຫຼື ໃຊ້ລະຫັດ PIN');

  // step 3: send to the sheet
  const mean = new Array(128).fill(0);
  samples.forEach(s => s.forEach((x, i) => mean[i] += x / samples.length));
  stopCamera();
  lastPhoto = photo;
  if (action === 'Leave') { identify({ op: 'identify', id: faceId, descriptor: mean.map(x => Math.round(x * 1e5) / 1e5) }); return; }
  submit({ op: 'face', action: action, id: faceId, descriptor: mean.map(x => Math.round(x * 1e5) / 1e5), photo: photo });
}
function dist2(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function mouthOpen(landmarks){ const p = landmarks.positions; return dist2(p[62], p[66]) / dist2(p[27], p[8]); }
const CHALLENGES = [
  { msg: 'ຄ່ອຍໆ ຫັນໜ້າໄປທາງຂ້າງ', sub: 'Slowly turn your head to one side', fail: 'ຫັນໜ້າຊ້າໆ ແລ້ວລອງໃໝ່',
    test: (lm, b) => Math.abs(yawOf(lm) - b.yaw) > TURN_NEEDED },
  { msg: 'ອ້າປາກກວ້າງໆ', sub: 'Open your mouth wide', fail: 'ອ້າປາກໃຫ້ກວ້າງ ແລ້ວລອງໃໝ່',
    test: (lm, b) => mouthOpen(lm) > b.mouth + 0.08 }
];
function faceFail(token, msg, sub){
  if (token !== runToken) return;
  $('oval').classList.remove('good');
  camText(msg, sub);
  $('camButtons').classList.remove('hidden');
}

// ---------------- keypad (PIN backup and manager screens) ----------------
const KEYS = ['1','2','3','4','5','6','7','8','9','del','0','go'];
KEYS.forEach(k => {

  b.className = 'k' + (k === 'del' ? ' small' : '') + (k === 'go' ? ' go' : '');

  b.onclick = () => press(k);

});

function startPin(){

  mode = 'pin';
  padState = { kind: 'pin', step: faceId ? 'pin' : 'id', id: faceId || '', pin: '' };
  $('padTitle').textContent = (action === 'In' ? 'ເຂົ້າວຽກ' : action === 'Out' ? 'ອອກວຽກ' : 'ຂໍລາພັກ') + ' · PIN';
  $('padTitle').className = (action === 'In' ? 'in' : action === 'Out' ? 'out' : 'mgr');
  $('hint').textContent = action === 'Leave' ? 'ຢືນຢັນຕົວຕົນກ່ອນຂໍລາພັກ' : 'ຈະຖ່າຍຮູບໄວ້ເປັນຫຼັກຖານ';
  show('pad'); renderPad(); resetIdle();
  startCamera();   // keep camera on so a photo is taken with the PIN
}
function startManager(){
  if (mode !== 'idle') return;
  collapseDetail();
  mode = 'mgr';
  padState = { kind: 'mgr', value: '' };
  $('padTitle').textContent = 'ລົງທະບຽນໃບໜ້າ';
  $('padTitle').className = 'mgr';
  $('hint').textContent = '';
  show('pad'); renderPad(); resetIdle();
}
function renderPad(){
  const s = padState; if (!s) return;
  let prompt = '', shown = '', ready = false, go = 'ຕໍ່ໄປ';
  if (s.kind === 'pin') {
    if (s.step === 'id') { prompt = 'ໃສ່ລະຫັດພະນັກງານ'; shown = s.id; ready = s.id.length > 0; }
    else { prompt = 'ໃສ່ລະຫັດ PIN'; shown = '•'.repeat(s.pin.length); ready = s.pin.length >= 4; go = 'ຢືນຢັນ'; }
  } else if (s.kind === 'mgr') {
    prompt = 'ໃສ່ລະຫັດຜູ້ຈັດການ'; shown = '•'.repeat(s.value.length); ready = s.value.length >= 4;
  } else if (s.kind === 'faceId') {
    prompt = 'ໃສ່ລະຫັດພະນັກງານ'; shown = s.value; ready = s.value.length > 0;
  } else if (s.kind === 'enrollId' || s.kind === 'manualId') {
    prompt = s.kind === 'enrollId' ? 'ລະຫັດພະນັກງານທີ່ຈະລົງທະບຽນໜ້າ' : 'ລະຫັດພະນັກງານ'; shown = s.value; ready = s.value.length > 0;
  }
  $('prompt').textContent = prompt; $('display').textContent = shown;
  $('goKey').textContent = go; $('goKey').disabled = !ready;
}
function press(k){
  const s = padState; if (!s || busy) return;
  resetIdle();
  const field = s.kind === 'pin' ? (s.step === 'id' ? 'id' : 'pin') : 'value';
  const max = field === 'id' || s.kind === 'enrollId' ? 8 : 8;
  if (k === 'del') {
    if (s.kind === 'pin' && s.step === 'pin' && !s.pin) s.step = 'id';
    else s[field] = s[field].slice(0, -1);
  } else if (k === 'go') {
    if (s.kind === 'pin') {
      if (s.step === 'id' && s.id) s.step = 'pin';
      else if (s.step === 'pin' && s.pin.length >= 4) {
        const photo = grabPhoto(); lastPhoto = photo;
        stopCamera();
        if (action === 'Leave') { identify({ op: 'verify', id: s.id, pin: s.pin }); return; }
        submit({ op: 'pin', action: action, id: s.id, pin: s.pin, photo: photo });
        return;
      }
    } else if (s.kind === 'mgr' && s.value.length >= 4) {
      managerCode = s.value;
      checkManager();
      return;
    } else if (s.kind === 'enrollId' && s.value) {
      startEnroll(s.value);
      return;
    } else if (s.kind === 'manualId' && s.value) {
      openManual(s.value);
      return;
    } else if (s.kind === 'faceId' && s.value) {
      faceId = s.value; mode = 'face';
      show('cam'); resetIdle(45000); runFace();
      return;
    }
  } else if (s[field].length < max) s[field] += k;
  renderPad();
}
document.addEventListener('keydown', e => {
  if (!$('pad').classList.contains('on')) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('del');
  else if (e.key === 'Enter') press('go');
  else if (e.key === 'Escape') goHome();
});

// ---------------- manager menu ----------------
let staffCache = [];
async function checkManager(){
  busy = true;
  const r = await api({ op: 'staff', manager: managerCode });
  busy = false;
  if (!r || !r.ok) { showError(r); return; }
  staffCache = r.staff || [];
  showMgrMenu();
}
function showMgrMenu(){
  runToken++; stopCamera(); busy = false;
  mode = 'mgr'; padState = null;
  const done = staffCache.filter(s => s.enrolled).length;
  $('mgrInfo').textContent = 'ລົງທະບຽນໜ້າແລ້ວ ' + done + ' / ' + staffCache.length + ' ຄົນ';
  show('mgrMenu'); resetIdle(90000);
}
function mgrPick(kind){
  padState = { kind: kind, value: '' };
  $('padTitle').textContent = kind === 'enrollId' ? 'ລົງທະບຽນໃບໜ້າ' : 'ບັນທຶກເຂົ້າ/ອອກແທນ';
  $('padTitle').className = 'mgr'; $('hint').textContent = '';
  show('pad'); renderPad(); resetIdle();
}
function backToMenuAfter(){ afterResult = showMgrMenu; }
function showChoice(title, sub, buttons){
  $('choiceTitle').textContent = title; $('choiceSub').textContent = sub;
  const box = $('choiceBtns'); box.innerHTML = '';
  buttons.forEach(([label, fn, dark]) => { const b = document.createElement('button'); b.className = 'pill' + (dark ? ' dark' : ''); b.textContent = label; b.onclick = fn; box.appendChild(b); });
  show('choice'); resetIdle(60000);
}

// ---------------- register a face: 10 samples from 3 angles ----------------
let enrollPerson = null, enrollSamples = [];
async function startEnroll(id){
  const person = staffCache.find(s => s.id === id);
  if (!person) { $('hint').textContent = 'ບໍ່ພົບລະຫັດພະນັກງານນີ້'; padState.value = ''; renderPad(); return; }
  if (!modelsReady) { $('hint').textContent = 'ລະບົບສະແກນໜ້າຍັງບໍ່ພ້ອມ'; return; }
  enrollPerson = person; enrollSamples = [];
  mode = 'enroll';
  $('camTitle').textContent = 'ລົງທະບຽນ: ' + person.name;
  $('camTitle').className = 'mgr';
  $('camButtons').classList.add('hidden');
  show('cam'); resetIdle(90000);
  const token = ++runToken;
  camText('ກຳລັງເປີດກ້ອງ…');
  if (!(await startCamera())) { camText('ເປີດກ້ອງບໍ່ໄດ້', 'ອະນຸຍາດໃຫ້ໃຊ້ກ້ອງໃນ browser'); return; }
  const v = $('video'); const deadline = Date.now() + 60000;
  let side = 0;
  const poses = [
    { n: 4, msg: 'ເບິ່ງກ້ອງຊື່ໆ ແລະ ຢູ່ນິ່ງໆ', sub: 'Look straight at the camera', ok: y => Math.abs(y) < 0.06 },
    { n: 3, msg: 'ຫັນໜ້າໄປທາງຂ້າງໜ້ອຍໜຶ່ງ', sub: 'Turn your head a little to one side', ok: y => Math.abs(y) >= 0.06 && Math.abs(y) <= 0.2 },
    { n: 3, msg: 'ຫັນໜ້າໄປອີກຂ້າງໜ້ອຍໜຶ່ງ', sub: 'Now a little to the other side', ok: y => Math.abs(y) >= 0.06 && Math.abs(y) <= 0.2 && Math.sign(y) === -side }
  ];
  const total = poses.reduce((a, p) => a + p.n, 0);
  for (let pi = 0; pi < poses.length; pi++) {
    const pose = poses[pi]; let got = 0;
    while (got < pose.n && Date.now() < deadline) {
      if (token !== runToken) return;
      camText(pose.msg + ' · ' + enrollSamples.length + ' / ' + total, pose.sub);
      const det = await faceapi.detectSingleFace(v, detOpts()).withFaceLandmarks().withFaceDescriptor();
      if (token !== runToken) return;
      const good = det && det.detection.score >= 0.8 && det.detection.box.width > v.videoWidth * 0.25 && pose.ok(yawOf(det.landmarks));
      if (good) {
        if (pi === 1 && !side) side = Math.sign(yawOf(det.landmarks));
        enrollSamples.push(Array.from(det.descriptor).map(x => Math.round(x * 1e4) / 1e4));
        got++;
        $('oval').classList.add('good');
        await sleep(300);
      } else {
        $('oval').classList.remove('good');
        if (det && det.detection.box.width <= v.videoWidth * 0.25) camText('ເຂົ້າມາໃກ້ກ້ອງອີກໜ້ອຍ · ' + enrollSamples.length + ' / ' + total, 'Come a little closer');
        await sleep(80);
      }
    }
  }
  if (enrollSamples.length < total) { camText('ບັນທຶກບໍ່ສຳເລັດ', 'ລອງໃໝ່ໃນບ່ອນທີ່ມີແສງດີ'); $('camButtons').classList.add('hidden'); return; }
  stopCamera();
  sendEnroll(false);
}
async function sendEnroll(force){
  busy = true; result('busy', 'ກຳລັງບັນທຶກ…', '', '');
  const r = await api({ op: 'enroll', manager: managerCode, id: enrollPerson.id, descriptors: enrollSamples, force: force });
  busy = false;
  if (r && r.ok) {
    enrollPerson.enrolled = true;
    result('good-mgr', 'ບັນທຶກໜ້າ ' + r.name + ' ແລ້ວ', '', 'ແຕະໜ້າຈໍເພື່ອກັບໄປເມນູ', r.warned ? 'ຖ້າສະແກນບໍ່ຜ່ານ ໃຫ້ໃຊ້ PIN' : '');
    resetIdle(20000); backToMenuAfter();
  } else if (r && r.code === 'similar') {
    showChoice('ໜ້າຄ້າຍກັບ ' + r.name, 'ຖ້າແນ່ໃຈວ່າແມ່ນ ' + enrollPerson.name + ' ແທ້ ກົດ "ບັນທຶກຕໍ່". ຖ້າສະແກນບໍ່ຜ່ານໃນພາຍຫຼັງ ລະບົບຈະຂໍ PIN.', [
      ['ບັນທຶກຕໍ່', () => sendEnroll(true), true],
      ['ລອງໃໝ່', () => startEnroll(enrollPerson.id)],
      ['ຍົກເລີກ', showMgrMenu]
    ]);
  } else { showError(r); backToMenuAfter(); }
}

// ---------------- manager clocks someone in or out ----------------
let manPerson = null, manAction = '', manReason = '';
const MAN_REASONS = ['ລືມສະແກນ', 'ສະແກນໜ້າບໍ່ໄດ້', 'ເຮັດວຽກນອກສະຖານທີ່', 'ອື່ນໆ'];
function openManual(id){
  const person = staffCache.find(s => s.id === id);
  if (!person) { $('hint').textContent = 'ບໍ່ພົບລະຫັດພະນັກງານນີ້'; padState.value = ''; renderPad(); return; }
  manPerson = person; manAction = ''; manReason = '';
  mode = 'manual';
  $('manTitle').textContent = 'ບັນທຶກແທນ · ' + person.name;
  const pick = (boxId, items, onPick) => {
    const box = $(boxId); box.innerHTML = '';
    items.forEach(([val, lbl]) => { const b = document.createElement('button'); b.textContent = lbl;
      b.onclick = () => { onPick(val); box.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); checkManual(); }; box.appendChild(b); });
  };
  pick('manAction', [['In', 'ເຂົ້າວຽກ'], ['Out', 'ອອກວຽກ']], v => manAction = v);
  pick('manReason', MAN_REASONS.map(x => [x, x]), v => manReason = v);
  const d = new Date(); $('manTime').value = pad2(d.getHours()) + ':' + pad2(d.getMinutes()); $('manTime').onchange = checkManual;
  show('manualForm'); checkManual(); resetIdle(120000);
}
function checkManual(){ resetIdle(120000); $('manSend').disabled = !manAction || !manReason || !$('manTime').value; }
async function sendManual(){
  if (busy || $('manSend').disabled) return; busy = true;
  result('busy', 'ກຳລັງບັນທຶກ…', '', '');
  const r = await api({ op: 'manual', manager: managerCode, id: manPerson.id, action: manAction, time: $('manTime').value, reason: manReason });
  busy = false;
  if (r && r.ok) {
    const tag = r.action === 'In' ? lateTag(r.minutes) : ('ເຮັດວຽກ ' + Math.floor((r.worked || 0) / 60) + ' ຊົ່ວໂມງ ' + ((r.worked || 0) % 60) + ' ນາທີ');
    result(r.action === 'In' ? 'good-in' : 'good-out', r.name, r.time, 'ບັນທຶກ' + (r.action === 'In' ? 'ເຂົ້າ' : 'ອອກ') + 'ວຽກແທນແລ້ວ', tag);
    resetIdle(20000); backToMenuAfter(); setTimeout(loadSummary, 1500);
  } else { showError(r); backToMenuAfter(); }
}

// ---------------- leave request ----------------
const LEAVE_TYPES = [['Annual leave','ລາພັກປະຈຳປີ'],['Sick leave','ລາປ່ວຍ'],['Personal leave','ລາກິດ'],['Unpaid leave','ລາບໍ່ໄດ້ເງິນເດືອນ'],['Other','ອື່ນໆ']];
let leaveToken = '', leaveType = '';
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function startLeave(){
  if (mode !== 'idle') return;
  if (!KEY) { showError({ code: 'badkey' }); return; }
  startFace('Leave');
}
async function identify(body){
  if (busy) return; busy = true;
  clearTimeout(idleTimer);
  result('busy', 'ກຳລັງກວດສອບ…', '', '');
  const r = await api(body);
  busy = false;
  if (r && r.ok) openLeaveForm(r); else showError(r);
}
function openLeaveForm(r){
  leaveToken = r.token; leaveType = '';
  mode = 'leaveForm';
  $('leaveTitle').textContent = 'ຂໍລາພັກ · ' + r.name;
  const box = $('leaveTypes'); box.innerHTML = '';
  LEAVE_TYPES.forEach(([val, lbl]) => {
    const b = document.createElement('button'); b.textContent = lbl;
    b.onclick = () => { leaveType = val; box.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); checkLeave(); };
    box.appendChild(b);
  });
  const now = new Date(), min = new Date(now.getTime() - 7 * 86400000), max = new Date(now.getTime() + 365 * 86400000);
  ['lvFrom','lvTo'].forEach(k => { $(k).min = ymd(min); $(k).max = ymd(max); $(k).value = ymd(now); $(k).onchange = checkLeave; });
  $('lvReason').value = '';
  show('leaveForm'); checkLeave(); resetIdle(180000);
}
function checkLeave(){
  resetIdle(180000);
  const f = $('lvFrom').value, t = $('lvTo').value;
  if (f && t && t < f) $('lvTo').value = f;
  const tt = $('lvTo').value;
  const days = f && tt ? Math.round((new Date(tt) - new Date(f)) / 86400000) + 1 : 0;
  $('lvDays').textContent = days > 0 ? 'ລວມ ' + days + ' ມື້' : '';
  $('lvSend').disabled = !leaveType || days < 1 || days > 60;
}
async function sendLeave(){
  if (busy || $('lvSend').disabled) return; busy = true;
  clearTimeout(idleTimer);
  result('busy', 'ກຳລັງສົ່ງ…', '', '');
  const r = await api({ op: 'leave', token: leaveToken, type: leaveType, from: $('lvFrom').value, to: $('lvTo').value, reason: $('lvReason').value });
  busy = false;
  if (r && r.ok) {
    result('good-mgr', 'ສົ່ງຄຳຂໍລາພັກແລ້ວ', '', r.from + ' → ' + r.to + ' · ' + r.days + ' ມື້', 'ລໍຖ້າຫົວໜ້າອະນຸມັດ');
    resetIdle(7000);
  } else showError(r);
}

// ---------------- talk to the sheet ----------------
async function api(body){
  body.key = KEY; body.branch = BRANCH;
  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify(body) });
    return await res.json();
  } catch (e) { console.error(e); return { ok: false, code: 'network' }; }
}
async function submit(body){
  if (busy) return; busy = true;
  clearTimeout(idleTimer);
  result('busy', 'ກຳລັງບັນທຶກ…', '', '');
  const r = await api(body);
  busy = false;
  onResult(r);
}
function lateTag(min){
  if (min == null) return '';
  if (min > 0) return 'ຊ້າ ' + min + ' ນາທີ';
  if (min < 0) return 'ກ່ອນເວລາ ' + (-min) + ' ນາທີ';
  return 'ຕົງເວລາ';
}
function onResult(r){
  if (r && r.ok){
    if (r.action === 'In') result('good-in', 'ສະບາຍດີ ' + r.name, r.time, 'ບັນທຶກເຂົ້າວຽກແລ້ວ', lateTag(r.minutes));
    else {
      const h = Math.floor((r.worked || 0) / 60), m = (r.worked || 0) % 60;
      result('good-out', 'ຂອບໃຈ ' + r.name, r.time, 'ບັນທຶກອອກວຽກແລ້ວ', 'ເຮັດວຽກ ' + h + ' ຊົ່ວໂມງ ' + m + ' ນາທີ');
    }
    resetIdle(5000); setTimeout(loadSummary, 1500); return;
  }
  showError(r);
}
function showError(r){
  const c = r ? r.code : 'bad';
  const msg = {
    nomatch:  ['ໃບໜ້າບໍ່ກົງກັບລະຫັດນີ້', (r && r.left > 0 ? 'ລອງໄດ້ອີກ ' + r.left + ' ເທື່ອ · ' : '') + 'ກວດລະຫັດພະນັກງານ ຫຼື ໃຊ້ PIN'],
    noface:   ['ລະຫັດນີ້ຍັງບໍ່ໄດ້ລົງທະບຽນໃບໜ້າ', 'ໃຊ້ລະຫັດ PIN ຫຼື ແຈ້ງຫົວໜ້າໃຫ້ລົງທະບຽນ'],
    notfound: ['ບໍ່ພົບລະຫັດພະນັກງານນີ້', 'ກວດລະຫັດແລ້ວລອງໃໝ່'],
    badpin:   ['ລະຫັດ PIN ບໍ່ຖືກຕ້ອງ', r && r.left > 0 ? 'ລອງໄດ້ອີກ ' + r.left + ' ເທື່ອ' : 'ລໍ 5 ນາທີ ຫຼື ແຈ້ງຫົວໜ້າ'],
    badmgr:   ['ລະຫັດຜູ້ຈັດການບໍ່ຖືກຕ້ອງ', ''],
    locked:   ['ໃສ່ລະຫັດຜິດຫຼາຍເທື່ອ', 'ລໍ 5 ນາທີ ຫຼື ແຈ້ງຫົວໜ້າ'],
    already:  [(r && r.name ? r.name + ' ' : '') + 'ເຂົ້າວຽກແລ້ວ', 'ເຂົ້າວຽກເວລາ ' + (r && r.time) + '. ຖ້າຈະອອກ ໃຫ້ກົດ ອອກວຽກ'],
    notin:    [(r && r.name ? r.name + ' ' : '') + 'ຍັງບໍ່ໄດ້ເຂົ້າວຽກ', 'ໃຫ້ກົດ ເຂົ້າວຽກ ກ່ອນ'],
    duplicate:['ໜ້ານີ້ລົງທະບຽນແລ້ວເປັນ ' + (r && r.name), 'ກວດລະຫັດພະນັກງານອີກຄັ້ງ'],
    unsure:   ['ບໍ່ແນ່ໃຈວ່າແມ່ນໃຜ', 'ລອງໃໝ່ ຫຼື ໃຊ້ລະຫັດ PIN'],
    unstable: ['ບັນທຶກໃບໜ້າບໍ່ຊັດ', 'ລອງໃໝ່ໃນບ່ອນແສງດີ ແລະ ຢູ່ນິ່ງໆ'],
    future:   ['ເວລາບໍ່ຖືກຕ້ອງ', 'ເລືອກເວລາທີ່ຜ່ານມາແລ້ວ'],
    badkey:   ['ເຄື່ອງນີ້ຍັງບໍ່ໄດ້ເຊື່ອມຕໍ່ລະບົບ', 'ເປີດລິ້ງທີ່ມີ key= ໃນເຄື່ອງນີ້'],
    network:  ['ເຊື່ອມຕໍ່ບໍ່ໄດ້', 'ກວດ Wi-Fi ແລ້ວລອງໃໝ່'],
    overlap:  ['ມີຄຳຂໍລາພັກໃນວັນດັ່ງກ່າວແລ້ວ', (r && r.from ? r.from + ' → ' + r.to + ' · ' : '') + (r && r.status === 'Yes' ? 'ອະນຸມັດແລ້ວ' : 'ລໍຖ້າອະນຸມັດ')],
    baddate:  ['ວັນທີບໍ່ຖືກຕ້ອງ', 'ເລືອກວັນທີໃໝ່ (ສູງສຸດ 60 ມື້)'],
    expired:  ['ໝົດເວລາ', 'ກະລຸນາເລີ່ມຂໍລາພັກໃໝ່'],
    bad:      ['ບັນທຶກບໍ່ໄດ້', 'ລອງໃໝ່ອີກຄັ້ງ'],
    error:    ['ບັນທຶກບໍ່ໄດ້', 'ລອງໃໝ່ອີກຄັ້ງ']
  }[c] || ['ບັນທຶກບໍ່ໄດ້', 'ລອງໃໝ່ອີກຄັ້ງ'];
  result('bad', msg[0], '', msg[1]);
  resetIdle(6000);
}

let afterResult = null;
function result(kind, big, time, note, tag){
  $('result').className = 'screen ' + kind;
  $('rBig').textContent = big;
  $('rTime').textContent = time;
  $('rNote').textContent = note;
  if (tag){ const t = document.createElement('div'); t.className = 'tag'; t.textContent = tag; $('rNote').appendChild(document.createElement('br')); $('rNote').appendChild(t); }
  show('result');
}
document.addEventListener('pointerdown', () => {
  if (!$('result').classList.contains('on') || busy) return;
  if (afterResult) { const f = afterResult; afterResult = null; f(); return; }
  goHome();
});
